{% extends 'base.html' %}

{% block title %}{{ post.title }}{% endblock %}

{% block content %}
<div class="container">
    <h1>{{ post.title }}</h1>
    <p><strong>Author:</strong> {{ post.author }}</p>
    <p><strong>Category:</strong> {{ post.category }}</p>
    <p><strong>Date Posted:</strong> {{ post.date_posted.strftime('%B %d, %Y') }}</p>
    <p><strong>Content:</strong></p>
    <p>{{ post.content }}</p>

    <a href="{{ url_for('post.get_posts') }}" class="btn btn-secondary">Back to posts</a>
</div>
{% endblock %}
